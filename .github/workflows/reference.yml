name: Real c302 reference smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: wormbrain doctor
      - run: wormbrain replay --scenario reversal --output runs/reference.json
