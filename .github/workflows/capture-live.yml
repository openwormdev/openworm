name: Capture continuous WORMBRAIN observer session
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: wormbrain doctor
      - run: wormbrain watch --seconds 45 --output runs/wormbrain-live-private.json
      - run: python scripts/publish_live_recording.py --input runs/wormbrain-live-private.json --output runs/wormbrain-live-public.json
      - uses: actions/upload-artifact@v4
        with:
          name: wormbrain-live-observer
          path: runs/wormbrain-live-public.json
          if-no-files-found: error
          retention-days: 7
