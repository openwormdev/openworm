[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wormstreet"
version = "0.1.0"
description = "A transparent c302 connectome paper-trading laboratory"
requires-python = ">=3.11,<3.14"
dependencies = ["c302==0.12.0", "pyNeuroML==1.3.22", "cect==0.3.4", "neuron==9.0.2", "fastapi==0.115.12", "uvicorn==0.34.2"]

[project.scripts]
wormstreet = "wormstreet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
